<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Piano Armónico{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎹</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{{ url_for('lista_alumnos') }}" class="brand">
                <span class="brand-mark">♪</span>
                <span class="brand-text">
                    <span class="brand-title">Piano Armónico</span>
                    <span class="brand-subtitle">Gestión pedagógica</span>
                </span>
            </a>
            <nav class="site-nav">
                <a href="{{ url_for('lista_alumnos') }}" class="{{ 'active' if request.endpoint != 'horarios' else '' }}">Alumnos</a>
                <a href="{{ url_for('horarios') }}" class="{{ 'active' if request.endpoint == 'horarios' else '' }}">Horarios</a>
                <span class="site-nav-divider"></span>
                <a href="{{ url_for('horarios', day='lunes') }}" class="site-nav-dia">Lun</a>
                <a href="{{ url_for('horarios', day='martes') }}" class="site-nav-dia">Mar</a>
                <a href="{{ url_for('horarios', day='miércoles') }}" class="site-nav-dia">Mié</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p><span class="footer-note">Piano Armónico · Aplicación de gestión pedagógica</span></p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
